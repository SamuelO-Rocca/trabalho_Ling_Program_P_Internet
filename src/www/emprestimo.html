<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'self'; base-uri 'self'">
    <meta name="description" content="Formulário de registro de empréstimo da Biblioteca Virtual">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../css/estilo.css" data-tpi2="estilo">
    <title>Registro de Empréstimo | Biblioteca Virtual</title>
</head>

<body>

    <nav class="menu-principal" aria-label="Menu principal">
        <a href="../index.html">Início</a>
        <a href="../admin.html">Painel Administrativo</a>
        <a href="usuario.html">Usuários</a>
        <a href="livro.html">Livros</a>
        <a href="autor.html">Autores</a>
        <a href="emprestimo.html">Empréstimos</a>
        <a href="categoria.html">Categorias</a>
    </nav>

    <h1>Registrar Empréstimo</h1>

    <main class="card">

        <form id="formEmprestimo">

            <label for="usuario">Usuário:</label>
            <input type="text" id="usuario" name="usuario" maxlength="150" required>

            <label for="livro">Livro:</label>
            <input type="text" id="livro" name="livro" maxlength="200" required>

            <label for="dataEmprestimo">Data do empréstimo:</label>
            <input type="date" id="dataEmprestimo" name="dataEmprestimo" required>

            <label for="dataDevolucao">Data prevista para devolução:</label>
            <input type="date" id="dataDevolucao" name="dataDevolucao" required>

            <label for="observacao">Observação:</label>
            <textarea id="observacao" name="observacao" rows="4" maxlength="500" required></textarea>

            <button type="submit">Registrar Empréstimo</button>

        </form>

    </main>

    <p class="tpi2-voltar-solto">
        <a href="../admin.html">Voltar para o painel administrativo</a>
    </p>

    <script src="../js/emprestimo.js"></script>

</body>

</html>
