<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'self'; base-uri 'self'">
    <meta name="description" content="Formulário de cadastro de categoria da Biblioteca Virtual">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../css/estilo.css" data-tpi2="estilo">
    <title>Cadastro de Categoria | Biblioteca Virtual</title>
</head>

<body>

    <nav class="menu-principal" aria-label="Menu principal">
        <a href="../index.html">Início</a>
        <a href="../admin.html">Painel Administrativo</a>
        <a href="usuario.html">Usuários</a>
        <a href="livro.html">Livros</a>
        <a href="autor.html">Autores</a>
        <a href="emprestimo.html">Empréstimos</a>
        <a href="categoria.html">Categorias</a>
    </nav>

    <h1>Cadastro de Categoria</h1>

    <main class="card">

        <form id="formCategoria">

            <label for="nome">Nome da categoria:</label>
            <input type="text" id="nome" name="nome" maxlength="100" required>

            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao" rows="4" maxlength="500" required></textarea>

            <label for="codigo">Código:</label>
            <input type="text" id="codigo" name="codigo" minlength="2" maxlength="50" required>

            <label for="status">Status:</label>
            <select id="status" name="status" required>
                <option value="">Selecione</option>
                <option value="ativa">Ativa</option>
                <option value="inativa">Inativa</option>
            </select>

            <label for="localizacao">Localização na biblioteca:</label>
            <input type="text" id="localizacao" name="localizacao" maxlength="150" required>

            <button type="submit">Cadastrar Categoria</button>

        </form>

    </main>

    <p class="tpi2-voltar-solto">
        <a href="../admin.html">Voltar para o painel administrativo</a>
    </p>

    <script src="../js/categoria.js"></script>

</body>

</html>
